# XcodeGen spec. Edit this file, then run `make gen`. Never edit VaultLight.xcodeproj by hand.
name: VaultLight

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  VaultLightCore:
    path: Packages/VaultLightCore

targets:
  VaultLight:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - package: VaultLightCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VaultLight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: "VaultLight is an unofficial client and is not affiliated with Bitwarden."
    entitlements:
      path: App/VaultLight.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VL_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(VL_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # rendered by scripts/render-app-icon.swift
        MARKETING_VERSION: "0.1.0"        # scripts/release.sh overrides both from the tag
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO   # no get-task-allow in release builds (spec §9.1)

schemes:
  VaultLight:
    build:
      targets:
        VaultLight: all
    run:
      config: Debug
    archive:
      config: Release
